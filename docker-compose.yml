name: clothing-ecommerce
x-application: &application
  build: .
  image: selvedge-local
x-backend-env: &backend-env
  DATABASE_URL: mysql://${MYSQL_USER:-ecommerce_app}:${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-clothing_ecommerce}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  UPLOAD_DIR: /app/storage/uploads

services:
  mysql:
    image: mysql:8.4
    command: ["--default-storage-engine=InnoDB", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-clothing_ecommerce}
      MYSQL_USER: ${MYSQL_USER:-ecommerce_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u$$MYSQL_USER $$MYSQL_DATABASE -e 'SELECT 1'"]
      interval: 5s
      timeout: 4s
      retries: 30
      start_period: 30s
  migrate:
    <<: *application
    environment: *backend-env
    depends_on:
      mysql: {condition: service_healthy}
    command: ["sh", "-c", "npm run db:migrate && npm run db:seed"]
  bootstrap-admin:
    <<: *application
    profiles: ["tools"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    environment:
      <<: *backend-env
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    command: ["npm", "run", "admin:create"]
  main-api:
    <<: *application
    depends_on:
      migrate: {condition: service_completed_successfully}
    environment:
      <<: *backend-env
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_VERIFY_SERVICE_SID: ${TWILIO_VERIFY_SERVICE_SID:-}
      PORT: 8080
      WEB_ORIGIN: http://localhost:3000
    volumes: ["uploads:/app/storage/uploads"]
    ports: ["127.0.0.1:8080:8080"]
    command: ["npm", "run", "start", "-w", "main-api"]
  admin-api:
    <<: *application
    depends_on:
      migrate: {condition: service_completed_successfully}
    environment:
      <<: *backend-env
      PORT: 8081
      WEB_ORIGIN: http://localhost:3001
    volumes: ["uploads:/app/storage/uploads"]
    ports: ["127.0.0.1:8081:8081"]
    command: ["npm", "run", "start", "-w", "admin-api"]
  main-web:
    <<: *application
    depends_on: [main-api]
    environment:
      API_ORIGIN: http://main-api:8080
    ports: ["127.0.0.1:3000:3000"]
    command: ["npm", "run", "start", "-w", "main-web"]
  admin-web:
    <<: *application
    depends_on: [admin-api]
    environment:
      API_ORIGIN: http://admin-api:8081
    ports: ["127.0.0.1:3001:3001"]
    command: ["npm", "run", "start", "-w", "admin-web"]

volumes:
  mysql-data:
  uploads:
